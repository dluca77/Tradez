mode: live                      # backtest | paper | live
live_trading_enabled: true      # must be explicitly flipped after validation

broker:
  name: mt5                     # mock | mt5 | oanda | ibkr
  account_currency: USD

instruments:
  # Restricted to what a real-data backtest (run_backtest_check.py, 60d of
  # real 5m OHLCV) actually showed a viable profit factor (~0.9-1.1+) for.
  # Every FX pair plus GER40 and XAGUSD came back deeply net-negative
  # (profit factor 0.28-0.79) over 400-1600 trades each — not noise, a
  # proven losing edge with this strategy set. Re-add an instrument here
  # only after a fresh real-data backtest shows it's actually viable.
  # 2026-08-04: NAS100 and SPX500 were removed earlier (not a strategy
  # exclusion - an instrument-level restriction, same as the FX pairs above)
  # after confirming via symbol_info().trade_mode that the MetaQuotes-Demo
  # account has the entire "Indexes" group disabled (retcode 10017 "Trade
  # disabled" regardless of signal quality). Re-added same day after
  # switching broker account to Vantage (VantageMarkets-Demo): confirmed live
  # trade_mode=4 (full trading) plus tight real spreads for both (NAS100
  # ~0.80pts on ~29000, SP500 ~0.36pts on ~7624). XPDUSD (palladium) and
  # XPTUSD (platinum) remain removed - both backtested well on Yahoo futures
  # data (profit factor 1.11 / 0.95) but MetaQuotes-Demo's real live spread
  # was 48-72x wider than XAUUSD's on those two, so the cost-to-profit filter
  # (costs.max_cost_to_expected_profit_ratio) correctly blocked every signal -
  # not re-verified yet on Vantage. Re-add once confirmed on this broker too.
  # UK100 and JPN225 added 2026-08-04: fresh real-data backtest (Yahoo, 60d
  # 5m) showed profit factor 1.03 for both (similar tier to XAUUSD's own
  # accepted bar), plus tight live Vantage spreads (UK100 ~0.7pts/10909,
  # JPN225ft ~14.25pts/64107). BTCUSD/ETHUSD backtested near/below breakeven
  # (0.99 / 0.96) - not added; crypto also stays off via crypto_enabled below.
  enabled:
    - XAUUSD
    - NAS100
    - SPX500
    - UK100
    - JPN225
  crypto_enabled: false

timeframes:
  execution: ["M1", "M3", "M5", "M15"]
  context: ["H1", "H4"]

account:
  starting_balance: 10000.0

risk:
  default_risk_pct: 0.0025
  min_risk_pct: 0.0010
  max_risk_pct: 0.0075
  absolute_max_risk_pct: 0.0075
  max_daily_loss_pct: 0.02
  max_weekly_loss_pct: 0.05
  max_monthly_drawdown_pct: 0.10
  max_total_open_risk_pct: 0.02
  max_concurrent_positions: 8
  max_trades_per_hour: 100000
  max_trades_per_day: 100000
  max_consecutive_losses: 4
  cooldown_minutes_after_losses: 60
  daily_profit_lock_pct: 0.02
  daily_profit_soft_lock_pct: 0.015
  daily_profit_giveback_pct: 0.65   # stop if 65% of day's peak profit is given back
  daily_profit_lock_min_confidence: 90   # after daily_profit_lock_pct is hit, only trade signals >= this confidence
  max_instrument_daily_loss_pct: 0.015   # per-instrument cap, separate from the account-wide max_daily_loss_pct
  martingale_forbidden: true

confidence:
  min_confidence_default: 80
  min_confidence_high_volatility: 85
  min_confidence_drawdown: 90

scanning:
  min_opportunity_score: 65
  scan_interval_seconds: 15

costs:
  max_cost_to_expected_profit_ratio: 0.35

news:
  pre_event_blackout_minutes: 30
  post_event_blackout_minutes: 15
  high_impact_blackout_minutes: 60
  # Optional: path to a JSON file a separate news-monitoring agent keeps
  # updated (see news_events.example.json). Hot-reloaded on every check —
  # no bot restart needed when the file changes. Leave unset to rely only
  # on load_events() (e.g. a manually populated calendar).
  events_file: data/news_events.json

sessions:
  prefer: ["london", "london_ny_overlap", "ny_open"]
  avoid: ["rollover", "illiquid_asia_tail"]

optimization:
  enabled: true
  min_sample_size: 30
  max_confidence_increase_per_cycle: 5
  max_risk_decrease_per_cycle: 0.05
  # DELIBERATELY kept empty — no strategy is ever hard-excluded, including
  # momentum_scalping and vwap_reversion despite their poor backtest numbers.
  # A strategy must always be free to look at live candles and produce its
  # own signal; the live confidence/risk-reward weighing in controller.py
  # is what decides per-signal whether it's worth taking, not a pre-set
  # exclusion list decided ahead of time.
  permanently_disabled_strategies: []
  # Per-instrument strategy allowlist. DELIBERATELY kept empty — every
  # instrument must stay able to use every strategy. Backtest evidence that
  # a strategy behaves badly on a given instrument (e.g. pullback was
  # strongly negative on XAUUSD but strongly positive on NAS100) should be
  # addressed by tuning that instrument's PARAMETERS below, not by
  # excluding the strategy outright.
  instrument_strategies: {}
  # Per-instrument strategy PARAMETER overrides — every instrument still
  # runs every eligible strategy, but each can tune how sensitive it is
  # (ADX threshold, RSI levels, ATR multipliers, ...). Evidence-based from
  # backtest results, not guessed.
  #
  # 2026-08-03: live trade history (491 closed mode=live trades since
  # 2026-07-31) showed trend_following's stop (default stop_atr_mult=1.5)
  # far too tight for its own EMA-stack/ADX setup — average hold time was
  # only 1.3-4.3 minutes, i.e. positions were getting stopped out by noise
  # before any real trend move could play out. Worst on NAS100 (26.7% win
  # rate, avg -0.73R, 1.3min hold); XAUUSD was closer to breakeven (50% win,
  # -0.05R) but still very short-lived. Widened stops and raised the ADX bar
  # so only stronger, more sustained trends qualify (most aggressive on
  # NAS100, the weakest performer). vwap_reversion showed the same pattern
  # on XAUUSD (only real-fill data available, n=4, so treated as directional
  # not conclusive): 25% win rate, avg confidence 77.8 vs trend_following's
  # 89.6, consistent with dist_atr_mult=1.5 triggering on overextensions too
  # mild to actually mean-revert. Raised the distance bar and stop room
  # uniformly (no per-instrument vwap_reversion fill data to differentiate).
  instrument_strategy_params:
    XAUUSD:
      trend_following: {adx_threshold: 24, stop_atr_mult: 1.8}
      vwap_reversion: {dist_atr_mult: 2.0, stop_atr_mult: 1.3}
      # run_hyperopt.py 2026-08-05, 40 trials, 60d Yahoo 5m data, 65/35
      # train/validation split: train pf=1.22 (304 trades), validation
      # pf=1.11 (257 trades, held out, not optimized on) - edge confirmed.
      pullback: {pullback_atr_mult: 0.70, rsi_low: 40, rsi_high: 64, stop_atr_mult: 1.31}
    SPX500:
      trend_following: {adx_threshold: 25, stop_atr_mult: 1.8}
      vwap_reversion: {dist_atr_mult: 2.0, stop_atr_mult: 1.3}
    NAS100:
      trend_following: {adx_threshold: 28, stop_atr_mult: 2.0}
      vwap_reversion: {dist_atr_mult: 2.0, stop_atr_mult: 1.3}
    # 2026-08-04: XPTUSD's 60d backtest was net negative overall (0.95
    # profit factor) but that blends two opposite strategies - trend_following
    # alone was strong (+1077.77, 58.1% win rate, defaults untouched since
    # they already work), while vwap_reversion alone was the reason the
    # instrument nets negative (-785.40, 12.7% win rate, avg -0.45R, worse
    # than XAUUSD's already-poor vwap_reversion numbers) - damped further
    # than XAUUSD's.
    XPTUSD:
      vwap_reversion: {dist_atr_mult: 2.2, stop_atr_mult: 1.3}

database:
  path: data/tradingbot.db

logging:
  level: INFO
  path: logs/tradingbot.log

dashboard:
  host: 0.0.0.0
  port: 8080

notifications:
  enabled: true
  channel: discord   # log | discord | slack
  # Webhook URL is a live credential - set via NOTIFY_WEBHOOK_URL in .env
  # (gitignored), never committed here in plaintext.
