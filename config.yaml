mode: paper                      # backtest | paper | live
live_trading_enabled: false      # must be explicitly flipped after validation

broker:
  name: mock                     # mock | mt5 | oanda | ibkr
  account_currency: USD

instruments:
  # Restricted to what a real-data backtest (run_backtest_check.py, 60d of
  # real 5m OHLCV) actually showed a viable profit factor (~0.9-1.1+) for.
  # Every FX pair plus GER40 and XAGUSD came back deeply net-negative
  # (profit factor 0.28-0.79) over 400-1600 trades each — not noise, a
  # proven losing edge with this strategy set. Re-add an instrument here
  # only after a fresh real-data backtest shows it's actually viable.
  enabled:
    - XAUUSD
    - NAS100
    - SPX500
  crypto_enabled: false

timeframes:
  execution: ["M1", "M3", "M5", "M15"]
  context: ["H1", "H4"]

account:
  starting_balance: 10000.0

risk:
  default_risk_pct: 0.0025
  min_risk_pct: 0.0010
  max_risk_pct: 0.0075
  absolute_max_risk_pct: 0.0075
  max_daily_loss_pct: 0.02
  max_weekly_loss_pct: 0.05
  max_monthly_drawdown_pct: 0.10
  max_total_open_risk_pct: 0.02
  max_concurrent_positions: 8
  max_trades_per_hour: 100000
  max_trades_per_day: 100000
  max_consecutive_losses: 4
  cooldown_minutes_after_losses: 60
  daily_profit_lock_pct: 0.02
  daily_profit_soft_lock_pct: 0.015
  daily_profit_giveback_pct: 0.5   # stop if 50% of day's peak profit is given back
  martingale_forbidden: true

confidence:
  min_confidence_default: 80
  min_confidence_high_volatility: 85
  min_confidence_drawdown: 90

scanning:
  min_opportunity_score: 65
  scan_interval_seconds: 15

costs:
  max_cost_to_expected_profit_ratio: 0.35

news:
  pre_event_blackout_minutes: 30
  post_event_blackout_minutes: 15
  high_impact_blackout_minutes: 60
  # Optional: path to a JSON file a separate news-monitoring agent keeps
  # updated (see news_events.example.json). Hot-reloaded on every check —
  # no bot restart needed when the file changes. Leave unset to rely only
  # on load_events() (e.g. a manually populated calendar).
  events_file: data/news_events.json

sessions:
  prefer: ["london", "london_ny_overlap", "ny_open"]
  avoid: ["rollover", "illiquid_asia_tail"]

optimization:
  enabled: true
  min_sample_size: 30
  max_confidence_increase_per_cycle: 5
  max_risk_decrease_per_cycle: 0.05
  # Proven net-negative in the same real-data backtest, across every
  # instrument tested (not just the ones we dropped above) — momentum_scalping
  # lost money on all 11 instruments, vwap_reversion had a ~10% win rate on
  # metals. Disabled unconditionally, independent of the adaptive
  # self-optimization state (which only disables on live paper-trading
  # stats and could otherwise silently re-enable these).
  permanently_disabled_strategies:
    - momentum_scalping
    - vwap_reversion
  # Per-instrument strategy allowlist, evidence-based from real-data
  # backtests. Leave an instrument out (or give it an empty list) to
  # apply no restriction beyond permanently_disabled_strategies above.
  # Example, once the next backtest round confirms per-instrument edges:
  # instrument_strategies:
  #   XAUUSD: [trend_following, breakout]
  #   XAGUSD: [support_resistance]
  instrument_strategies: {}

database:
  path: data/tradingbot.db

logging:
  level: INFO
  path: logs/tradingbot.log

dashboard:
  host: 0.0.0.0
  port: 8080

notifications:
  enabled: true
  channel: log   # log | webhook
  webhook_url: ""
